<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="https://global.oktacdn.com/okta-signin-widget/7.14.0/css/okta-sign-in.min.css" />
  <script src="https://global.oktacdn.com/okta-signin-widget/7.14.0/js/okta-sign-in.min.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink:#29d6b1; --paper:#f5f3ef; --accent:#0a21f4; --muted:#8a8880; }
    html, body { height: 100%; background: var(--paper); font-family: 'DM Sans', sans-serif; color: var(--ink); }
    body { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .panel-left {
      background: var(--ink); display: flex; flex-direction: column;
      justify-content: space-between; padding: 3rem; position: relative; overflow: hidden;
    }
    .panel-left::before {
      content:''; position:absolute; top:-120px; right:-120px;
      width:380px; height:380px; border-radius:50%;
      background:radial-gradient(circle,#e63f2a55 0%,transparent 70%); pointer-events:none;
    }
    .brand { display:flex; align-items:center; gap:.75rem; }
    .brand-dot { width:28px; height:28px; background:var(--accent); border-radius:50%; }
    .brand-name { font-family:'Syne',sans-serif; font-weight:800; font-size:1.25rem; color:#fff; letter-spacing:-.02em; }
    .hero-text { z-index:1; }
    .hero-text h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(2.5rem,5vw,4rem); color:#fff; line-height:1.05; letter-spacing:-.03em; margin-bottom:1.25rem; }
    .hero-text h1 span { color:var(--accent); }
    .hero-text p { color:#9b9897; font-size:1rem; line-height:1.65; max-width:320px; }
    .panel-footer { color:#555; font-size:.75rem; }
    .panel-right { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 2rem; background:var(--paper); }
    .login-card { width:100%; max-width:420px; }
    .login-card h2 { font-family:'Syne',sans-serif; font-weight:700; font-size:1.75rem; letter-spacing:-.03em; margin-bottom:.35rem; }
    .login-card .subtitle { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }
    #okta-sign-in.auth-container.main-container { background:#fff!important; border:1.5px solid #e8e4de!important; border-radius:16px!important; box-shadow:0 4px 32px rgba(0,0,0,.06)!important; padding:2rem!important; min-width:unset!important; width:100%!important; }
    #okta-sign-in .auth-header { display:none!important; }
    #okta-sign-in input[type=text], #okta-sign-in input[type=password], #okta-sign-in input[type=email] { border-radius:10px!important; border:1.5px solid #ddd9d2!important; font-size:.9rem!important; padding:.75rem 1rem!important; }
    #okta-sign-in input:focus { border-color:var(--accent)!important; box-shadow:0 0 0 3px rgba(230,63,42,.12)!important; outline:none!important; }
    #okta-sign-in .button-primary { background:var(--accent)!important; border-color:var(--accent)!important; border-radius:10px!important; font-family:'Syne',sans-serif!important; font-weight:600!important; padding:.75rem!important; }
    #okta-sign-in .link { color:var(--accent)!important; }
    #error-banner { display:none; background:#fff0ee; border:1.5px solid #f5b8b0; border-radius:10px; padding:.75rem 1rem; color:var(--accent); font-size:.85rem; margin-bottom:1rem; }
    @media(max-width:768px){ body{grid-template-columns:1fr;} .panel-left{display:none;} }
  </style>
</head>
<body>
  <div class="panel-left">
    <div class="brand"><div class="brand-dot"></div><span class="brand-name">MyApp</span></div>
    <div class="hero-text">
      <h1>Secure<br/>sign&#8209;in<br/>with <span>Okta.</span></h1>
      <p>Enterprise-grade authentication built for developers.</p>
    </div>
    <div class="panel-footer">Powered by Okta</div>
  </div>
  <div class="panel-right">
    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue to your dashboard.</p>
      <div id="error-banner"></div>
      <div id="okta-sign-in-widget"></div>
    </div>
  </div>
<script src="js/config.js"></script>
<script>
  const signIn = new OktaSignIn({
    issuer:    OKTA_CONFIG.issuer,
    clientId:  OKTA_CONFIG.clientId,
    redirectUri: OKTA_CONFIG.redirectUri,
    scopes:    ['openid', 'profile', 'email'],
    useInteractionCodeFlow: true,
    useClassicEngine: false,
    tokenManager: { storage: 'sessionStorage' },
    features: { registration: false },
    i18n: { en: { 'primaryauth.title': 'Sign in to MyApp' } }
  });

  signIn.showSignInAndRedirect({ el: '#okta-sign-in-widget' })
    .catch(err => {
      const banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent = 'Error: ' + err.message;
    });
</script>
</body>
</html>
